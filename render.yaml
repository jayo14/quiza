services:
  # --- Web API ---
  - type: web
    name: quiza-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: API_V1_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: quiza-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_MINUTES
        value: "43200"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GEMINI_EMBEDDING_FALLBACK_MODELS
        value: gemini-embedding-2
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_DIR
        value: /app/storage
      - key: VECTOR_STORE_BACKEND
        value: sqlite
      - key: REDIS_URL
        sync: false
      - key: AUTO_START_CELERY
        value: "false"
      - key: CORS_ORIGINS
        value: "*"

  # --- Celery Worker (optional: enable for proper production setup) ---
  # Uncomment this section if you want a dedicated worker process.
  # Requires upgrading to a paid Render plan ($7/mo minimum).
  # If left commented out, AUTO_START_CELERY=true runs the worker
  # as a subprocess inside the web service above.
  #
  # - type: worker
  #   name: quiza-celery-worker
  #   env: docker
  #   dockerfilePath: ./backend/Dockerfile
  #   dockerContext: ./backend
  #   plan: basic
  #   region: oregon
  #   envVars:
  #     - key: APP_ENV
  #       value: production
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: quiza-db
  #         property: connectionString
  #     - key: REDIS_URL
  #       sync: false
  #     - key: AUTO_START_CELERY
  #       value: "false"
  #     - key: GEMINI_API_KEY
  #       sync: false
  #     - key: GEMINI_EMBEDDING_MODEL
  #       value: text-embedding-004
  #     - key: VECTOR_STORE_BACKEND
  #       value: sqlite
  #     - key: STORAGE_BACKEND
  #       value: local
  #     - key: STORAGE_DIR
  #       value: /app/storage
  #   # The worker runs: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
  #   # Override the start command if needed:
  #   # startCommand: celery -A app.core.celery_app worker --loglevel=info --concurrency=2

databases:
  - name: quiza-db
    plan: free
    region: oregon
    databaseName: quiza
    user: quiza_user
