[project]
name = "quiza-backend"
version = "0.1.0"
description = "Quiza AI-powered learning platform backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "google-genai>=0.1.0",
    "numpy>=1.26",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "pillow>=10.3",
    "pytesseract>=0.3.10",
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
